name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Unit- en UI-tests (telefoon, foldable, tablet via Robolectric) — eerst, zodat
      # een kapotte indeling nooit als APK uitkomt.
      - name: Tests
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log

      # Telling per testklasse als notitie in het build-overzicht.
      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fail = skip = 0
          for x in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(x).getroot()
              t, f, e, s = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              tot += t; fail += f + e; skip += s
              print(f"::notice::{r.get('name')}: {t} tests, {f + e} mislukt, {s} overgeslagen")
          print(f"::notice::TOTAAL: {tot} tests, {fail} mislukt, {skip} overgeslagen")
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee build.log

      # Compileer- en testfouten als annotaties, zodat ze zonder de volledige log leesbaar zijn.
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            grep -E "^e: |What went wrong| FAILED$|AssertionError|Exception:" -A2 "$f" | head -60 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
          done
          # Per mislukte test de melding uit het JUnit-rapport.
          for x in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$x" ] || continue
            python3 - "$x" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for f in list(tc.findall("failure")) + list(tc.findall("error")):
                  msg = (f.get("message") or f.text or "").strip().splitlines()
                  print(f"::error::TEST {tc.get('classname')}.{tc.get('name')}: {' | '.join(msg[:3])[:900]}")
          PY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: airco-apk
          path: app/build/outputs/apk/release/app-release.apk
