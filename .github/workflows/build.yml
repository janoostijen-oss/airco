name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee build.log

      # Compileerfouten als annotaties, zodat ze zonder de volledige log leesbaar zijn.
      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong" -A1 build.log | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: airco-apk
          path: app/build/outputs/apk/release/app-release.apk
