name: Perf (emulator)

# Handmatig: vergelijkt koude start en geheugen van een basis-commit met de huidige code,
# op dezelfde emulator en onder dezelfde omstandigheden.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Basis-commit om mee te vergelijken"
        required: true
        default: "14ee84c"

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK's (basis en nieuw)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p apks
          ./gradlew :app:assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk apks/new.apk
          git worktree add ../base "${{ inputs.base }}"
          (cd ../base && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon -q)
          cp ../base/app/build/outputs/apk/release/app-release.apk apks/base.apk
          ls -l apks
          echo "::notice::APK-grootte basis $(stat -c %s apks/base.apk) B, nieuw $(stat -c %s apks/new.apk) B"

      - name: KVM aanzetten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Meten op emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/perf.sh

      - name: Samenvatting
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, statistics as st, os
          rows = list(csv.DictReader(open("perf-results.csv"))) if os.path.exists("perf-results.csv") else []
          def col(v, k):
              return [float(r[k]) for r in rows if r["variant"] == v and r[k]]
          out = ["| | basis | nieuw | n |", "|---|---|---|---|"]
          for k, label in [("total_ms", "Koude start (TotalTime, ms)"), ("pss_kb", "Geheugen PSS (kB)"), ("java_heap_kb", "Java-heap (kB)")]:
              b, n = col("base", k), col("new", k)
              if not b or not n:
                  continue
              mb, mn = st.median(b), st.median(n)
              print(f"::notice::{label}: mediaan basis {mb:.0f}, nieuw {mn:.0f} ({(mn - mb) / mb * 100:+.1f}%), n={len(b)}/{len(n)}")
              out.append(f"| {label} | {mb:.0f} | {mn:.0f} | {len(b)}/{len(n)} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(out) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.csv
